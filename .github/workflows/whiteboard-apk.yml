# SPDX-License-Identifier: GPL-3.0-or-later
name: Whiteboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-whiteboard

permissions:
  contents: read

concurrency:
  group: whiteboard-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Configure lightweight debug build
        run: |
          cat > local.properties <<'EOF'
          enable_coverage=false
          enable_leak_canary=false
          EOF

      - name: Download Robolectric SDKs
        run: ./gradlew robolectricSdkDownload --daemon

      - name: Format Kotlin and export style changes
        run: |
          ./gradlew :AnkiDroid:ktlintFormat --daemon
          python3 - <<'PY'
          import base64, subprocess
          patch = subprocess.run(['git', 'diff', '--', 'AnkiDroid/src'], check=True, capture_output=True).stdout
          encoded = base64.b64encode(patch).decode()
          for index in range(0, len(encoded), 10000):
              print('WHITEBOARD_FORMAT_PATCH ' + encoded[index:index + 10000])
          PY

      - name: Check whiteboard persistence and reviewer regressions
        run: >-
          ./gradlew :AnkiDroid:testFullDebugUnitTest --daemon
          --tests 'com.ichi2.anki.ui.windows.reviewer.whiteboard.*'
          --tests 'com.ichi2.anki.ui.windows.reviewer.ReviewerWhiteboardPersistenceTest'
          --tests 'com.ichi2.anki.ui.windows.reviewer.ReviewerWhiteboardGestureTest'

      - name: Build separate universal test APK
        run: ./gradlew :AnkiDroid:assembleFullDebug -PwhiteboardBuild --daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnkiDroid-Whiteboard-APK
          path: AnkiDroid/build/outputs/apk/full/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Whiteboard-test-results
          path: |
            AnkiDroid/build/reports/tests/
            AnkiDroid/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
