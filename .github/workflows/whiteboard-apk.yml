# SPDX-License-Identifier: GPL-3.0-or-later
name: Whiteboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-whiteboard

permissions:
  contents: read

concurrency:
  group: whiteboard-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Configure lightweight debug build
        run: |
          cat > local.properties <<'EOF'
          enable_coverage=false
          enable_leak_canary=false
          EOF

      - name: Download Robolectric SDKs
        run: ./gradlew robolectricSdkDownload --daemon

      - name: Check Kotlin formatting
        run: ./gradlew :AnkiDroid:ktlintCheck --daemon

      - name: Check whiteboard persistence and reviewer regressions
        run: >-
          ./gradlew :AnkiDroid:testFullDebugUnitTest --daemon
          --tests 'com.ichi2.anki.ui.windows.reviewer.whiteboard.*'
          --tests 'com.ichi2.anki.ui.windows.reviewer.ReviewerWhiteboardPersistenceTest'
          --tests 'com.ichi2.anki.ui.windows.reviewer.ReviewerWhiteboardGestureTest'

      - name: Build separate universal test APK
        run: ./gradlew :AnkiDroid:assembleFullDebug -PwhiteboardBuild -Duniversal-apk=true --daemon

      - name: Select universal whiteboard APK
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          outputs = pathlib.Path('AnkiDroid/build/outputs/apk')
          candidates = []
          for metadata_path in outputs.rglob('output-metadata.json'):
              metadata = json.loads(metadata_path.read_text())
              if metadata.get('variantName') != 'fullDebug':
                  continue
              assert metadata['applicationId'] == 'com.ichi2.anki.whiteboard', metadata
              for element in metadata['elements']:
                  if not element.get('filters'):
                      candidates.append(metadata_path.parent / element['outputFile'])
          assert len(candidates) == 1, f'Expected one universal APK, found {candidates}'
          destination = pathlib.Path('whiteboard-apk/AnkiDroid-Whiteboard.apk')
          destination.parent.mkdir(exist_ok=True)
          shutil.copy2(candidates[0], destination)
          print(f'Packaged {candidates[0]} ({destination.stat().st_size} bytes)')
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnkiDroid-Whiteboard-APK
          path: whiteboard-apk/AnkiDroid-Whiteboard.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Whiteboard-test-results
          path: |
            AnkiDroid/build/reports/tests/
            AnkiDroid/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
